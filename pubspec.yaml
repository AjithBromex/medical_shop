name: medical_shop_manager
description: Medical shop collection manager - offline Flutter port of the Flask app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3   # Windows / Linux / macOS desktop support
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  csv: ^6.0.0
  share_plus: ^9.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  shared_preferences: ^2.2.3
  sqflite_common_ffi_web: ^0.4.3+1
  http: ^1.2.1
  open_filex: ^5.0.0
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  googleapis_auth: ^1.6.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/home_logo.png
    - assets/splash_icon.png
    - assets/DancingScript.ttf

  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/DancingScript.ttf


