name: medical_shop_manager
description: Medical shop collection manager - offline Flutter port of the Flask app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3   # Windows / Linux / macOS desktop support
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  csv: ^6.0.0
  share_plus: ^9.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  shared_preferences: ^2.2.3
  sqflite_common_ffi_web: ^0.4.3+1
  http: ^1.2.1
  mongo_dart: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

